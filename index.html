<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Slide Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cont">
        <div class="left">
            <div class="title">Number Slide Puzzle</div>
            <div class="controls">
                <div class="buttons">
                    <button id="strtGameBtn" onclick="shuffleBoard()">Shuffle</button>
                    <button id="resetBtn" onclick="createBoard()">Reset</button>
                    <button id="pauseBtn" onclick="togglePause()">Play</button>
                </div>
                <div class="rowsInputCont">
                    <label for="rowsInput">Rows:</label>
                    <input type="number" name="rowsInput" id="rowsInput" min="2" max="40">
                </div>
                <div class="colsInputCont">
                    <label for="colsInput">Columns:</label>
                    <input type="number" name="colsInput" id="colsInput" min="2" max="40">
                </div>
                <div class="movementSensitivityCont">
                    <label for="movementSensitivity">Sensitivity:</label>
                    <input type="number" name="movementSensitivity" id="movementSensitivity" min="1" max="100">
                </div>
            </div>
            <div class="time">00:00</div>
            <div class="statusFace" id="statusFace">🙂</div>
        </div>
        <div class="right">
            <div id="board"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
